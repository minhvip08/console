spring:
  application:
    name: backoffice-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/console}
    username: ${DB_USER:console}
    password: ${DB_PASS:console_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Synthetic integration only. No live provider or scheduled-sync mode exists.
shopee:
  mock:
    enabled: ${SHOPEE_MOCK_ENABLED:false}
    admin-users: ${SHOPEE_MOCK_ADMIN_USERS:}
