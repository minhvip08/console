plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.simi'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.assertj:assertj-core'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        enabled = true
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            html.required = true
            xml.required = false
            csv.required = false
        }
    }

    // ./gradlew :console-api:openTestReport   — mở HTML test result
    tasks.register('openTestReport', Exec) {
        dependsOn test
        group = 'verification'
        description = 'Mở HTML test report trong browser'
        def reportFile = layout.buildDirectory.file("reports/tests/test/index.html").get().asFile
        commandLine 'xdg-open', reportFile.absolutePath
    }

    // ./gradlew :console-api:openCoverageReport   — mở HTML JaCoCo coverage
    tasks.register('openCoverageReport', Exec) {
        dependsOn jacocoTestReport
        group = 'verification'
        description = 'Mở HTML JaCoCo coverage report trong browser'
        def reportFile = layout.buildDirectory.file("reports/jacoco/test/html/index.html").get().asFile
        commandLine 'xdg-open', reportFile.absolutePath
    }
}
