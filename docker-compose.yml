# Local dev infra for Scenario Console.
# Profiles:
#   (default)  — postgres + redis (core dev, Phase 1-6)
#   full       — adds kafka + debezium (Phase 7)
#   localstack — adds LocalStack for S3, CloudWatch (Phase 8)
#   all        — everything
#
# Usage:
#   docker compose up -d postgres redis                               # core dev
#   docker compose --profile full up -d                               # + Kafka/Debezium
#   docker compose --profile localstack up -d                         # + LocalStack (S3, CW)
#   docker compose --profile full --profile localstack up -d          # full stack

services:

  # ─── Core services (always on) ───

  postgres:
    image: postgres:15
    container_name: console-postgres
    environment:
      POSTGRES_DB: console
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # wal_level=logical bắt buộc cho Debezium CDC (Phase 7).
    # max_wal_senders + max_replication_slots reserve cho replication.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: console-redis
    ports:
      - "6379:6379"
    # Cluster mode disabled — 3-key Lua script cần single shard hoặc hash tag.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Phase 7: CDC + Reconciliation (profile: full) ───

  kafka:
    image: bitnami/kafka:3.7
    container_name: console-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["full"]

  debezium:
    image: debezium/connect:2.7
    container_name: console-debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["full"]

  # Init container: register Debezium connector for Console tables
  debezium-init:
    image: curlimages/curl:8.7.1
    container_name: console-debezium-init
    depends_on:
      debezium:
        condition: service_healthy
    entrypoint: >
      sh -c '
        echo "Registering Debezium PostgreSQL connector...";
        curl -s -X POST http://debezium:8083/connectors -H "Content-Type: application/json" -d '{
          "name": "console-cdc",
          "config": {
            "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
            "database.hostname": "postgres",
            "database.port": "5432",
            "database.user": "console",
            "database.password": "console_dev",
            "database.dbname": "console",
            "database.server.name": "console",
            "table.include.list": "public.action_execution,public.scenario_execution,public.saga_compensation_log",
            "topic.prefix": "console",
            "slot.name": "console_reconciliation_slot",
            "plugin.name": "pgoutput",
            "publication.name": "console_reconciliation_pub",
            "publication.autocreate.mode": "filtered",
            "transforms": "unwrap",
            "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
            "transforms.unwrap.drop.tombstones": "false",
            "key.converter.schemas.enable": "false",
            "value.converter.schemas.enable": "false"
          }
        }' && echo " → Done!" || echo " → Already exists (idempotent)"
      '
    restart: "no"
    profiles: ["full"]

  # ─── Phase 8: LocalStack for AWS (profile: localstack) ───
  # Emulates S3, CloudWatch, CloudWatch Logs locally.
  # Endpoint: http://localhost:4566

  localstack:
    image: localstack/localstack:3.5
    container_name: console-localstack
    ports:
      - "4566:4566"      # Gateway endpoint
      - "4510-4559:4510-4559"  # External service ports
    environment:
      SERVICES: s3,cloudwatch,logs,sns
      DEBUG: 0
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["localstack"]

volumes:
  postgres_data:
  localstack_data:
