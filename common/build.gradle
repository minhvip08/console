// Shared library — domain entities, ports, ULID utilities.
// Không apply Spring Boot plugin vì đây là library, không deploy độc lập.

dependencies {
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    // Hibernate annotations (@JdbcTypeCode for JSONB/ARRAY mapping).
    // Service modules pull in hibernate-core via spring-boot-starter-data-jpa.
    compileOnly 'org.hibernate.orm:hibernate-core'
}

// Library module — không tạo bootJar
tasks.matching { it.name == 'bootJar' || it.name == 'bootRun' }.configureEach {
    enabled = false
}
